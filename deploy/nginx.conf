# Fine-tuned Nginx configuration for Sony Vaio Ubuntu Server
# Offloads static assets from Node.js, saving CPU and RAM

server {
    listen 80;
    server_name _;

    # Client body size limit
    client_max_body_size 20M;

    # Gzip Compression (CPU-friendly level 4 for older Core 2 Duo / Core i CPUs)
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 4;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/x-javascript
        image/svg+xml;

    # Root for static assets offloading
    root /var/www/drg-app/.output/public;

    # Direct static asset serving (never hits Node.js - massive RAM/CPU saving)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
        try_files $uri =404;
    }

    # Favicon, manifest, service worker
    location ~* \.(ico|png|jpg|jpeg|svg|webp|webmanifest|txt)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
        try_files $uri @proxy;
    }

    # Reverse proxy to TanStack Start Node.js server
    location / {
        try_files $uri @proxy;
    }

    location @proxy {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # WebSocket support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Standard headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts to prevent hung worker connections
        proxy_connect_timeout 10s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }
}
